<!DOCTYPE html>
<html lang="am">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // Addresses used to look like /#/read?ref=JHN.3; they are now /read?ref=JHN.3.
    // Move old links (shared, bookmarked) over before the app starts.
    if (location.hash.indexOf('#/') === 0) {
      var base = (document.querySelector('base') || {}).href || '/';
      history.replaceState(null, '', new URL(location.hash.slice(2), base).href);
    }
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Amharic Bible with audio and Ge'ez-aware search.">
  <!-- Browser chrome matches the app's page color (docs/UX_REDESIGN_PLAN.md §5.2). -->
  <meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131614" media="(prefers-color-scheme: dark)">

  <!-- Link previews (chat apps, social media) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="መጽሐፍ ቅዱስ · Amharic Bible">
  <meta property="og:description" content="Read and listen to the Amharic Bible, with Ge'ez-aware search and study tools.">
  <meta property="og:locale" content="am_ET">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="መጽሐፍ ቅዱስ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>መጽሐፍ ቅዱስ · Amharic Bible</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading screen shown while the app downloads (several megabytes, slow on
    mobile networks), instead of a blank page. Removed on Flutter's first frame.
    Colors are the app's tokens; swap the wordmark for the logo once it exists.
  -->
  <style>
    :root {
      --page: #F5F3EE;
      --ink: #1E6B4E;
      --muted: #4B4A43;
      --accent: #855A14;
      --track: #E0DCD2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #131614;
        --ink: #8ED5B3;
        --muted: #BFC6BF;
        --accent: #E8C07B;
        --track: #323735;
      }
    }
    html, body { margin: 0; height: 100%; background: var(--page); }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--page);
      font-family: "Noto Serif Ethiopic", "Abyssinica SIL", "Nyala", "Kefa", "Ebrima", serif;
      transition: opacity 250ms cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .name { margin: 0; color: var(--ink); font-size: 40px; font-weight: 600; line-height: 1.3; }
    #splash .sub {
      margin: 0;
      color: var(--muted);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    /* A small rule with a diamond: a placeholder for the haräg ornament. */
    #splash .rule { display: flex; align-items: center; gap: 8px; color: var(--accent); }
    #splash .rule::before, #splash .rule::after {
      content: "";
      width: 48px;
      height: 1px;
      background: currentColor;
    }
    #splash .rule span { width: 8px; height: 8px; background: currentColor; transform: rotate(45deg); }
    #splash .bar {
      position: relative;
      width: 160px;
      height: 3px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 2px;
      background: var(--track);
    }
    #splash .bar::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: 2px;
      background: var(--accent);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <p class="name">መጽሐፍ ቅዱስ</p>
    <div class="rule" aria-hidden="true"><span></span></div>
    <p class="sub">Amharic Bible</p>
    <div class="bar" aria-label="Loading"></div>
  </div>
  <noscript>
    <p style="font-family: system-ui, sans-serif; text-align: center; padding: 16px;">
      This app needs JavaScript. · ይህ መተግበሪያ ጃቫስክሪፕት ያስፈልገዋል።
    </p>
  </noscript>
  <script>
    // Fade the loading screen out once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
