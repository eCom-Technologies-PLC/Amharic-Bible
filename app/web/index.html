<!DOCTYPE html>
<html lang="am">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // Addresses used to look like /#/read?ref=JHN.3; they are now /read?ref=JHN.3.
    // Move old links (shared, bookmarked) over before the app starts.
    if (location.hash.indexOf('#/') === 0) {
      var base = (document.querySelector('base') || {}).href || '/';
      history.replaceState(null, '', new URL(location.hash.slice(2), base).href);
    }
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Amharic Bible with audio and Ge'ez-aware search.">
  <!-- Browser chrome matches the app's page color (docs/UX_REDESIGN_PLAN.md §5.2). -->
  <meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131614" media="(prefers-color-scheme: dark)">

  <!-- Link previews (chat apps, social media) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="መጽሐፍ ቅዱስ · Amharic Bible">
  <meta property="og:description" content="Read and listen to the Amharic Bible, with Ge'ez-aware search and study tools.">
  <meta property="og:locale" content="am_ET">
  <meta name="twitter:card" content="summary">

  <link rel="manifest" href="manifest.json">

  <!--
    Loading screen shown while the app downloads (several megabytes, slow on
    mobile networks), instead of a blank page. Removed on Flutter's first frame.
    Colors are the app's tokens; swap the wordmark for the logo once it exists.
  -->
  <style>
    :root {
      --page: #F5F3EE;
      --ink: #1E6B4E;
      --muted: #4B4A43;
      --accent: #855A14;
      --track: #E0DCD2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #131614;
        --ink: #8ED5B3;
        --muted: #BFC6BF;
        --accent: #E8C07B;
        --track: #323735;
      }
    }
    html, body { margin: 0; height: 100%; background: var(--page); }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--page);
      font-family: "Noto Serif Ethiopic", "Abyssinica SIL", "Nyala", "Kefa", "Ebrima", serif;
      transition: opacity 250ms cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .name { margin: 0; color: var(--ink); font-size: 40px; font-weight: 600; line-height: 1.3; }
    #splash .sub {
      margin: 0;
      color: var(--muted);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    /* A small rule with a diamond: a placeholder for the haräg ornament. */
    #splash .rule { display: flex; align-items: center; gap: 8px; color: var(--accent); }
    #splash .rule::before, #splash .rule::after {
      content: "";
      width: 48px;
      height: 1px;
      background: currentColor;
    }
    #splash .rule span { width: 8px; height: 8px; background: currentColor; transform: rotate(45deg); }
    #splash .bar {
      position: relative;
      width: 160px;
      height: 3px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 2px;
      background: var(--track);
    }
    #splash .bar::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: 2px;
      background: var(--accent);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <p class="name">መጽሐፍ ቅዱስ</p>
    <div class="rule" aria-hidden="true"><span></span></div>
    <p class="sub">Amharic Bible</p>
    <div class="bar" aria-label="Loading"></div>
  </div>
  <noscript>
    <p style="font-family: system-ui, sans-serif; text-align: center; padding: 16px;">
      This app needs JavaScript. · ይህ መተግበሪያ ጃቫስክሪፕት ያስፈልገዋል።
    </p>
  </noscript>
  <script>
    // Installing the app (Chrome, Edge, Android): keep the browser's offer so Me
    // can show "Install the app" when, and only when, it is available.
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.abInstallPrompt = event;
      window.dispatchEvent(new Event('ab-installable'));
    });
    window.addEventListener('appinstalled', function () {
      window.abInstallPrompt = null;
      window.dispatchEvent(new Event('ab-installable'));
    });
    // Keep a copy of the app so it opens offline after the first visit (web/sw.js).
    if ('serviceWorker' in navigator) {
      var firstVisit = !navigator.serviceWorker.controller;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
      // On the first visit the app loads before the worker runs: once both have
      // started, tell the worker what was loaded so it keeps those files too.
      var started = new Promise(function (resolve) {
        window.addEventListener('flutter-first-frame', resolve, { once: true });
      });
      Promise.all([navigator.serviceWorker.ready, started]).then(function (ready) {
        if (!firstVisit) return;
        var loaded = performance.getEntriesByType('resource')
          .filter(function (e) { return e.initiatorType !== 'audio' && e.initiatorType !== 'video'; })
          .map(function (e) { return e.name; });
        ready[0].active.postMessage({ keep: loaded });
      });
    }
    // Fade the loading screen out once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });

    // Start the app: flutter_bootstrap.js (web/flutter_bootstrap.js) loads
    // Flutter and the app's code. A new release waits while the app is open
    // (web/sw.js). When this is the only tab, it takes over first, before any
    // of the app has loaded, and the page starts again from the new release.
    function startApp() {
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      document.body.appendChild(script);
    }
    // True once the waiting release is taking over; false when the app should
    // start as it is (another tab is open, or no answer in time). Only a page
    // still holding the app back says "go", so a late answer changes nothing.
    function askToTakeOver(waiting) {
      return new Promise(function (resolve) {
        var channel = new MessageChannel();
        var decided = false;
        var decide = function (taken) {
          if (decided) return;
          decided = true;
          if (taken) {
            channel.port1.postMessage('go');
            nudge(6);
          }
          resolve(taken);
        };
        channel.port1.onmessage = function (event) { decide(event.data === true); };
        waiting.postMessage({ takeOver: true }, [channel.port2]);
        setTimeout(function () { decide(false); }, 3000);
      });
    }
    // The new release takes over once the old one has stopped, which the old
    // one does when it is idle; Chrome checks that at the end of an event, so
    // the page sends it a few empty messages.
    function nudge(times) {
      var controller = navigator.serviceWorker.controller;
      if (!controller || times <= 0) return;
      controller.postMessage({});
      setTimeout(function () { nudge(times - 1); }, 500);
    }
    // When a takeover tried in this tab didn't complete, it is tried once more,
    // then the app starts as it is.
    function triedRecently() {
      try {
        return Date.now() - Number(sessionStorage.getItem('ab-took-over') || 0) < 30000;
      } catch (_) {
        return false;
      }
    }
    ('serviceWorker' in navigator ? navigator.serviceWorker.getRegistration() : Promise.resolve())
      .then(function (registration) {
        if (!registration || !registration.waiting) return startApp();
        var reload = function () { location.reload(); };
        navigator.serviceWorker.addEventListener('controllerchange', reload);
        return askToTakeOver(registration.waiting).then(function (taken) {
          if (!taken) {
            navigator.serviceWorker.removeEventListener('controllerchange', reload);
            return startApp();
          }
          // The page reloads once the new release controls it. If that takes
          // too long, a reload (a navigation) lets it take over.
          var retry = !triedRecently();
          try { sessionStorage.setItem('ab-took-over', String(Date.now())); } catch (_) {}
          setTimeout(function () {
            if (retry) return reload();
            navigator.serviceWorker.removeEventListener('controllerchange', reload);
            startApp();
          }, 5000);
        });
      })
      .catch(startApp);
  </script>
</body>
</html>
